<style>
body{

background:linear-gradient(135deg,#8e44ad,#c39bd3);

#splash{

width:100%;
height:100vh;

#login{

}

.card{

width:260px;
}

#app{display:none;}

header{
background:#7d3c98;
color:white;
padding:30px 15px 15px;
margin-top: env(safe-area-inset-top);

justify-content:space-between;
}

.profile{text-align:center;}
.profile img{width:90px;border-radius:50%;}

.content-box{

margin:20px;
margin-bottom:100px; /* 🔥 biar ga ketutup navbar */

border-radius:20px;
}

/* 🔥 NAVBAR BARU */
.menu{

bottom:15px;
left:10px;
right:10px;
background:#7d3c98;
display:flex;
justify-content:space-around;
padding:15px 10px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.menu button{
background:none;
border:none;
color:white;
font-size:22px;
}

.menu button:active{
transform:scale(0.9);
}

#notif{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#2ecc71;
color:white;
padding:10px 20px;
border-radius:20px;
display:none;
}

.chat-box{
height:220px;
overflow:auto;
border:1px solid #ddd;
padding:10px;
border-radius:10px;
}
</style>
</head>

<body>

<div id="login">
<div class="card">

<select id="nama">

<div class="menu">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('proyek')">📘</button>
<button onclick="showPage('pr')">📄</button>
<button onclick="showPage('chat')">💬</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyCstjDxDTZilvN4oUIIzlTwOFBp5ghSfA4",
authDomain: "grade-7-72186.firebaseapp.com",
databaseURL: "https://grade-7-72186-default-rtdb.asia-southeast1.firebasedatabase.app/",
projectId: "grade-7-72186",
storageBucket: "grade-7-72186.firebasestorage.app",
messagingSenderId: "1025282319862",
appId: "1:1025282319862:web:1f99761709370aebb253d7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let dataRealtime={proyek:"",pr:""};
let chatData=[];
let isAdmin=false;
let lastNotifProyek="";
let lastNotifPR="";

document.getElementById("nama").addEventListener("change",function(){
let pass=document.getElementById("password");
if(this.value==="ricolas samuel"){
pass.style.display="block";
}else{
pass.style.display="none";
pass.value="";
}
});

function loginUser(){
let nama=document.getElementById("nama").value;
let gender=document.getElementById("gender").value;
let pass=document.getElementById("password").value;

if(!nama||!gender){alert("Isi semua!");return;}

if(nama==="ricolas samuel"){
if(pass!=="grade7admin"){alert("Password salah!");return;}
isAdmin=true;
}

localStorage.setItem("nama",nama);
localStorage.setItem("gender",gender);
localStorage.setItem("admin",isAdmin);

loadApp();
}

function loadApp(){
let nama=localStorage.getItem("nama");
let gender=localStorage.getItem("gender");
isAdmin=localStorage.getItem("admin")==="true";

if(nama){
splash.style.display="none";
login.style.display="none";
app.style.display="block";

hai.innerText="HAI "+nama.toUpperCase();
namaUser.innerText=nama.toUpperCase();

avatar.src=gender==="laki"
?"https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
:"https://cdn-icons-png.flaticon.com/512/4140/4140051.png";

listenRealtime();
showPage("home");
}else{
splash.style.display="none";
login.style.display="flex";
}
}

function showNotif(msg){
notif.innerText=msg;
notif.style.display="block";
setTimeout(()=>notif.style.display="none",2000);
}

function listenRealtime(){

db.ref("kelas").on("value",snap=>{
let d=snap.val()||{};

if(d.proyek && d.proyek!==lastNotifProyek){
showNotif("📘 Proyek diperbarui!");
lastNotifProyek=d.proyek;
}

if(d.pr && d.pr!==lastNotifPR){
showNotif("📄 PR diperbarui!");
lastNotifPR=d.pr;
}

dataRealtime.proyek=d.proyek||"";
dataRealtime.pr=d.pr||"";

updateUI();
});

db.ref("chat").on("value",snap=>{
let data=snap.val()||{};
chatData = Object.values(data);
renderChat();
});

}

function renderChat(){
let chatBox=document.getElementById("chatBox");
if(!chatBox) return;

let html="";
chatData.forEach(i=>{
html+=`<div style="margin-bottom:5px;">
<b>${i.nama}:</b> ${i.msg}
</div>`;
});

chatBox.innerHTML=html;
chatBox.scrollTop=chatBox.scrollHeight;
}

function updateUI(){
if(document.getElementById("proyekText")){
document.getElementById("proyekText").innerHTML=dataRealtime.proyek;
}
if(document.getElementById("prText")){
document.getElementById("prText").innerHTML=dataRealtime.pr;
}
}

function saveProyek(){
let isi=document.getElementById("editProyek").value;
if(!isi){alert("Isi dulu!");return;}
db.ref("kelas").update({proyek:isi});
showNotif("✅ Proyek diupload!");
}

function savePR(){
let isi=document.getElementById("editPR").value;
if(!isi){alert("Isi dulu!");return;}
db.ref("kelas").update({pr:isi});
showNotif("✅ PR diupload!");
}

function sendChat(){
let input=document.getElementById("chatInput");
let msg=input.value.trim();
let nama=localStorage.getItem("nama");

if(!msg)return;

db.ref("chat").push({
nama:nama,
msg:msg,
time:Date.now()
});

input.value="";
}

function showPage(p){
let c=document.getElementById("content");

if(p==="home"){
c.innerHTML=`
<div class="content-box" style="text-align:center;">
<h2>🔥GRADE 7🔥</h2>
<h3>ALWAYS NUMBER 1️⃣</h3>
<img src="https://i.postimg.cc/Zqh6BmqQ/IMG-20260420-180646.png" style="width:100%;border-radius:15px;">
</div>`;
}

if(p==="proyek"){
c.innerHTML=`
<div class="content-box">
<h2>PROYEK</h2>
${isAdmin?`
<textarea id="editProyek">${dataRealtime.proyek}</textarea><br><br>
<button onclick="saveProyek()" style="background:#7d3c98;color:white;padding:10px;border:none;border-radius:10px;width:100%;">UPLOAD PROYEK</button>
`:`<p id="proyekText"></p>`}
</div>`;
updateUI();
}

if(p==="pr"){
c.innerHTML=`
<div class="content-box">
<h2>HOMEWORK</h2>
${isAdmin?`
<textarea id="editPR">${dataRealtime.pr}</textarea><br><br>
<button onclick="savePR()" style="background:#7d3c98;color:white;padding:10px;border:none;border-radius:10px;width:100%;">UPLOAD PR</button>
`:`<p id="prText"></p>`}
</div>`;
updateUI();
}

if(p==="chat"){
c.innerHTML=`
<div class="content-box">
<h2>CHAT KELAS</h2>
<div id="chatBox" class="chat-box"></div>
<input id="chatInput" placeholder="Tulis pesan...">
<button onclick="sendChat()">Kirim</button>
</div>`;

setTimeout(renderChat,50);
}

}

function logout(){
localStorage.clear();
location.reload();
}

window.onload=()=>setTimeout(loadApp,1000);

</script>

</body>
</html>
