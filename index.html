<script>

const firebaseConfig = {
apiKey: "AIzaSyCstjDxDTZilvN4oUIIzlTwOFBp5ghSfA4",
authDomain: "grade-7-72186.firebaseapp.com",
databaseURL: "https://grade-7-72186-default-rtdb.asia-southeast1.firebasedatabase.app/",
projectId: "grade-7-72186",

messagingSenderId: "1025282319862",
appId: "1:1025282319862:web:1f99761709370aebb253d7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messaging = firebase.messaging();

// 🔥 SERVICE WORKER
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('firebase-messaging-sw.js');
}

// 🔥 NOTIF
async function initNotif(){
try{
await Notification.requestPermission();

const token = await messaging.getToken({
vapidKey: "BBFHJnOPZl05vD8-YncyQ5orh4DpiNG3BxAnmDwTz0riKyvskW8FHSBGLf93y_rVSjEX0Luh44Sr5vvEhlr1QIQ"
});

db.ref("tokens").push(token);

}catch(e){console.log(e);}
}

messaging.onMessage((payload)=>{
showNotif(payload.notification.title+" : "+payload.notification.body);
});

// ================== KODE KAMU TETAP ==================

let dataRealtime={proyek:"",pr:""};
let chatData=[];

let mediaRecorder;
let audioChunks=[];

function loginUser(){
let nama=document.getElementById("nama").value;
let gender=document.getElementById("gender").value;
if(!nama||!gender){alert("Isi semua!");return;}
localStorage.setItem("nama",nama);
localStorage.setItem("gender",gender);
loadApp();
}

function loadApp(){
let nama=localStorage.getItem("nama");
let gender=localStorage.getItem("gender");

if(nama){
splash.style.display="none";
login.style.display="none";
app.style.display="block";

hai.innerText="HAI "+nama.toUpperCase();
namaUser.innerText=nama.toUpperCase();

avatar.src=gender==="laki"
?"https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
:"https://cdn-icons-png.flaticon.com/512/4140/4140051.png";

initNotif();
listenRealtime();
showPage("home");
}else{
splash.style.display="none";
login.style.display="flex";
}
}

function showNotif(msg){
notif.innerText=msg;
notif.style.display="block";
setTimeout(()=>notif.style.display="none",2000);
}

function listenRealtime(){
db.ref("kelas").on("value",snap=>{
let d=snap.val()||{};
dataRealtime.proyek=d.proyek||"";
dataRealtime.pr=d.pr||"";
updateUI();
});

db.ref("chat").on("value",snap=>{
chatData=Object.values(snap.val()||{});
renderChat();
});
}

function renderChat(){
let chatBox=document.getElementById("chatBox");
if(!chatBox) return;

let html="";
chatData.forEach(i=>{
if(i.msg) html+=`<div><b>${i.nama}:</b> ${i.msg}</div>`;
if(i.audio) html+=`<audio controls src="${i.audio}"></audio>`;
});

chatBox.innerHTML=html;
chatBox.scrollTop=chatBox.scrollHeight;
}

function updateUI(){
if(document.getElementById("proyekText")){
proyekText.innerHTML=dataRealtime.proyek;
}
if(document.getElementById("prText")){
prText.innerHTML=dataRealtime.pr;
}
}

function saveProyek(){ db.ref("kelas").update({proyek:editProyek.value}); }
function savePR(){ db.ref("kelas").update({pr:editPR.value}); }

function sendChat(){
let msg=chatInput.value.trim();
if(!msg)return;

db.ref("chat").push({
nama:localStorage.getItem("nama"),
msg:msg
});

chatInput.value="";
}

async function startRecord(){
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder=new MediaRecorder(stream);
audioChunks=[];

mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);

mediaRecorder.onstop=async ()=>{
let blob=new Blob(audioChunks,{type:'audio/mp3'});
let ref=firebase.storage().ref("voice/"+Date.now()+".mp3");
await ref.put(blob);
let url=await ref.getDownloadURL();

db.ref("chat").push({
nama:localStorage.getItem("nama"),
audio:url
});
};

mediaRecorder.start();
}

function stopRecord(){ mediaRecorder.stop(); }

function showPage(p){
let c=document.getElementById("content");

if(p==="home"){
c.innerHTML=`
<div class="content-box" style="text-align:center;">
<h2>🔥 GRADE 7 🔥</h2>
<h3>ALWAYS NUMBER 1️⃣</h3>
<img src="https://i.postimg.cc/Zqh6BmqQ/IMG-20260420-180646.png" style="width:100%;border-radius:15px;">
</div>`;
}

if(p==="proyek"){
c.innerHTML=`
<div class="content-box">
<h2>PROYEK</h2>
<textarea id="editProyek">${dataRealtime.proyek}</textarea>
<button onclick="saveProyek()">UPLOAD</button>
</div>`;
}

if(p==="pr"){
c.innerHTML=`
<div class="content-box">
<h2>PR</h2>
<textarea id="editPR">${dataRealtime.pr}</textarea>
<button onclick="savePR()">UPLOAD</button>
</div>`;
}

if(p==="chat"){
c.innerHTML=`
<div class="content-box">
<h2>CHAT</h2>
<div id="chatBox" class="chat-box"></div>
<input id="chatInput">
<button onclick="sendChat()">Kirim</button>
<br><br>
<button onclick="startRecord()">🎤</button>
<button onclick="stopRecord()">⏹</button>
</div>`;
setTimeout(renderChat,100);
}
}

function logout(){
localStorage.clear();
location.reload();
}

window.onload=()=>setTimeout(loadApp,1000);

</script>
